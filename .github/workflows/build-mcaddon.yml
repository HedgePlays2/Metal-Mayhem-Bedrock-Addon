name: Build Metal Mayhem MCAddon

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "behavior_pack/**"
      - "resource_pack/**"
      - "pack_icon.png"
      - ".github/workflows/build-mcaddon.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare pack icons
        run: |
          test -f pack_icon.png
          cp pack_icon.png behavior_pack/pack_icon.png
          cp pack_icon.png resource_pack/pack_icon.png

      - name: Validate all JSON files and pack manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for root in (Path("behavior_pack"), Path("resource_pack")):
              files = sorted(root.rglob("*.json"))
              if not files:
                  raise SystemExit(f"No JSON files found under {root}")
              for path in files:
                  with path.open(encoding="utf-8") as f:
                      json.load(f)
                  print(f"JSON OK: {path}")

          for path in (Path("behavior_pack/manifest.json"), Path("resource_pack/manifest.json")):
              with path.open(encoding="utf-8") as f:
                  manifest = json.load(f)
              assert manifest.get("format_version") == 2, f"Unexpected format_version in {path}"
              assert manifest.get("header", {}).get("uuid"), f"Missing header UUID in {path}"
              assert manifest.get("modules"), f"Missing modules in {path}"
              print(f"Manifest OK: {path}")

          behavior_manifest = json.loads(Path("behavior_pack/manifest.json").read_text(encoding="utf-8"))
          resource_uuid = json.loads(Path("resource_pack/manifest.json").read_text(encoding="utf-8"))["header"]["uuid"]
          dependencies = behavior_manifest.get("dependencies", [])
          assert any(dep.get("uuid") == resource_uuid for dep in dependencies), "Behavior pack does not depend on this resource pack UUID"
          print("Behavior/resource pack dependency OK")
          PY

      - name: Package behavior and resource packs
        run: |
          (cd behavior_pack && zip -qr ../Metal-Mayhem-Behavior.mcpack .)
          (cd resource_pack && zip -qr ../Metal-Mayhem-Resources.mcpack .)
          zip -q -j Metal-Mayhem.mcaddon Metal-Mayhem-Behavior.mcpack Metal-Mayhem-Resources.mcpack
          unzip -l Metal-Mayhem.mcaddon

      - name: Upload MCAddon artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metal-Mayhem-Bedrock-Addon
          path: Metal-Mayhem.mcaddon
          if-no-files-found: error
